name: Dozer
options:
  usesTabs: false
  tabWidth: 4
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  deploymentTarget:
    macOS: "13.0"
targets:
  Dozer:
    type: application
    platform: macOS
    deploymentTarget:
      macOS: "13.0"
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    sources:
      - Dozer
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 31
        DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
        DEVELOPMENT_TEAM: "3RC67D2VWB"
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Dozer/Other/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        MARKETING_VERSION: "4.2.1"
        PRODUCT_BUNDLE_IDENTIFIER: "com.klooless.Dozer"
        PRODUCT_NAME: Dozer
        SWIFT_VERSION: "5.0"
        VERSIONING_SYSTEM: apple-generic
schemes:
  Dozer:
    build:
      targets:
        Dozer: all
    run:
      config: Debug
    archive:
      config: Release
